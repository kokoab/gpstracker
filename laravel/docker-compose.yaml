version: "3.9"

services:
  app:
    build: .
    container_name: laravel_app
    restart: unless-stopped  # Auto-restart if container stops
    depends_on:
      - db
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=gps_tracker
      - DB_USERNAME=root
      - DB_PASSWORD=root
    command: php artisan serve --host=0.0.0.0 --port=8000
    tty: true
    stdin_open: true
    # Resource limits to prevent OOM crashes
    deploy:
      resources:
        limits:
          memory: 512M  # Limit to 512MB (half of t2.micro's 1GB)
        reservations:
          memory: 256M  # Reserve 256MB
    # Health check (check if PHP process is running)
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo \"OK\";' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped  # Auto-restart if container stops
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=gps_tracker
    volumes:
      - db_data:/var/lib/mysql
    # Resource limits to prevent OOM crashes
    deploy:
      resources:
        limits:
          memory: 384M  # Limit to 384MB
        reservations:
          memory: 128M  # Reserve 128MB
    # Health check
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db_data:

